name: Classic Chat backup verification
on:
  push:
    branches:
      - classic-chat-backup-20261127
    paths:
      - 'classic-chat/**'
      - 'tools/classic-chat-bridge/**'
      - 'START-CLASSIC-CHAT.cmd'
      - '.github/workflows/classic-chat-backup-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-windows:
    if: github.ref == 'refs/heads/classic-chat-backup-20261127'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node checks and Windows DPAPI round trip
        working-directory: tools/classic-chat-bridge
        run: npm run check
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Synthetic browser regression (no account, tokens or AI requests)
        run: python tools/classic-chat-bridge/test/browser_offline.py
