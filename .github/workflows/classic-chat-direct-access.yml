name: Classic Chat direct access verification
on:
  push:
    branches:
      - classic-chat-backup-20261127
    paths:
      - 'classic-chat/**'
      - 'verification/direct_access.py'
      - '.github/workflows/classic-chat-direct-access.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-access:
    if: github.ref == 'refs/heads/classic-chat-backup-20261127'
    strategy:
      fail-fast: false
      matrix:
        mode: [file, preview]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser fixture
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Verify direct access with synthetic archive
        run: python verification/direct_access.py ${{ matrix.mode }}
