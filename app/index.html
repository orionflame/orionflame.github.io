<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>Classic Chat Test</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Local conversations">
    <div class="sidebar-top">
      <button id="sidebar-close" class="icon-button" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <span class="side-title">Classic Chat Test</span>
    </div>
    <button id="new-chat" class="new-chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div class="history-heading">This session</div>
    <div id="history" class="history"></div>
    <div class="sidebar-foot">
      <span class="local-only">Local session only</span>
      <button id="manage-usage-side" class="usage-link">Manage plan usage ↗</button>
    </div>
  </aside>
  <main id="main" class="main">
    <header class="toolbar">
      <div class="toolbar-left">
        <button id="sidebar-open" class="icon-button" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <button id="top-new-chat" class="icon-button" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="mode-switch" aria-label="Interface mode">
        <button class="mode-choice active" aria-current="page">Chat</button>
        <button class="mode-choice" disabled title="Work mode is not available through this prototype">Work</button>
      </div>
      <div class="toolbar-right">
        <span id="connection-dot" class="connection-dot"></span>
        <button id="account-button" class="account-button">Connect ChatGPT</button>
      </div>
    </header>

    <div id="login-popover" class="login-popover hidden" role="dialog" aria-label="ChatGPT account connection">
      <div class="popover-header"><strong>ChatGPT plan</strong><button id="close-popover" class="close-small" aria-label="Close">×</button></div>
      <div id="connection-detail" class="connection-detail">Not connected.</div>
      <div id="models-hint" class="small-text">Use your ChatGPT account to authorize eligible AI requests.</div>
      <div id="account-actions" class="account-actions">
        <button id="sign-in" class="action-primary">Continue with ChatGPT</button>
        <button id="add-account" class="action-secondary hidden">Add account</button>
        <button id="disconnect" class="action-secondary hidden">Disconnect</button>
        <button id="test-plan" class="action-secondary hidden">Test subscription</button>
        <button id="cancel-sign-in" class="action-secondary hidden">Cancel sign-in</button>
      </div>
      <p id="test-result" class="small-text"></p>
      <button id="manage-usage" class="usage-link">Manage usage ↗</button>
    </div>

    <div id="empty-state" class="empty-state">
      <h1>What can I help with?</h1>
    </div>

    <div id="conversation" class="conversation hidden" role="log" aria-live="polite" aria-label="Conversation messages"></div>

    <section id="composer-section" class="composer-section">
      <div id="notice" class="notice hidden" role="status"></div>
      <form id="composer" class="composer">
        <button id="attach" type="button" class="composer-aux disabled-style" disabled title="Attachments are not supported in this prototype" aria-label="Attachments unavailable">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="prompt" rows="1" aria-label="Message" placeholder="Ask ChatGPT" spellcheck="true"></textarea>
        <div class="composer-actions">
          <select id="model-picker" aria-label="Model" title="Models permitted for your ChatGPT plan"><option value="">Connect first</option></select>
          <button id="stop" class="send-button hidden" type="button" title="Stop generation" aria-label="Stop generation">
            <svg viewBox="0 0 24 24" class="solid-icon"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
          <button id="send" class="send-button" type="submit" title="Send message" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </div>
      </form>
      <div id="suggestions" class="suggestions">
        <button disabled title="Image generation is not supported in the subscription-sharing SDK"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg>Create an image or sticker</button>
        <button id="writing-suggestion"><svg viewBox="0 0 24 24"><path d="m4 20 4-1 12-12-3-3L5 16zM15 6l3 3"/></svg>Write or edit</button>
        <button disabled title="Web search is not supported in this prototype"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4 4 4 14 0 18M12 3c-4 4-4 14 0 18"/></svg>Search the web</button>
      </div>
      <div id="footnote" class="footnote">Independent prototype · Uses official Sign in with ChatGPT · Chats are not synced</div>
    </section>
  </main>
</div>
</body>
</html>
