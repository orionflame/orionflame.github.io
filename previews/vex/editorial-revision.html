<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pragmatic VEX | Editorial revision preview</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;min-height:100%;background:#090b10;color:#f7f5f2;font-family:Inter,Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading b{display:block;font-size:18px;margin-bottom:8px}.loading span{color:#aeb4be;font-size:13px}
</style>
</head>
<body>
<div class="loading" id="loading"><div><b>Loading comparison preview</b><span>Pragmatic VEX editorial revision</span></div></div>
<script>
(async function(){
  const files=['editorial-payload-01.txt','editorial-payload-02.txt','editorial-payload-03.txt'];
  const read=async file=>{
    const response=await fetch(file,{cache:'no-store'});
    if(!response.ok) throw new Error(file+' returned '+response.status);
    return response.text();
  };
  try{
    const encoded=(await Promise.all(files.map(read))).join('').replace(/\s/g,'');
    const binary=atob(encoded);
    const compressed=Uint8Array.from(binary,c=>c.charCodeAt(0));
    if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support the preview decoder.');
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loading').innerHTML='<div><b>Preview failed to load</b><span>'+error.message+'</span></div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
